<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>OX 퀴즈 풀고 10,000원 받기</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<style>
  :root{--blue:#2563EB;--blue-d:#1D4ED8;--red:#DC2626;--green:#16A34A;--ink:#111827;--mut:#6B7280;--line:#E5E7EB;--bg:#F3F4F6;--card:#FFFFFF;--gold:#D97706}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Segoe UI",system-ui,sans-serif;display:flex;justify-content:center}
  .app{width:100%;max-width:440px;min-height:100dvh;background:var(--card);display:flex;flex-direction:column;position:relative;overflow:hidden}
  .top{padding:16px 18px 12px;border-bottom:1px solid var(--line)}
  .goal{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:9px}
  .goal .lbl{font-size:13px;color:var(--mut);font-weight:600}
  .goal .pts{font-size:20px;font-weight:800;letter-spacing:-.5px}
  .goal .pts b{color:var(--gold)} .goal .pts .g{color:var(--mut);font-weight:600;font-size:14px}
  .dots{display:flex;gap:5px;margin-top:11px}
  .dots .d{flex:1;height:6px;border-radius:99px;background:var(--line)}
  .dots .d.done{background:var(--gold)} .dots .d.on{background:var(--ink)}
  /* timer */
  .timer{padding:14px 18px 4px}
  .trow{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
  .trow .stg{font-size:15px;font-weight:800}
  .trow .sec{font-family:ui-monospace,Menlo,monospace;font-size:15px;font-weight:800;color:var(--mut)}
  .trow .sec.warn{color:var(--red)}
  .tbar{height:7px;background:var(--line);border-radius:99px;overflow:hidden}
  .tfill{height:100%;width:100%;background:var(--green);border-radius:99px;transition:width .1s linear,background .3s}
  /* 이번 맞추면 얼마 (후킹 티저) */
  .qtease{margin:14px 16px 2px;background:linear-gradient(90deg,#FFF7E6,#FEF3C7);border:1.5px solid #FCD34D;border-radius:14px;padding:11px 14px;text-align:center;font-size:15px;font-weight:800;color:var(--ink);box-shadow:0 3px 10px #F59E0B22;animation:teasepulse 1.8s ease-in-out infinite}
  .qtease .plus{color:#D97706}
  .qtease .tot{color:var(--gold);font-size:21px;letter-spacing:-.5px}
  @keyframes teasepulse{0%,100%{transform:scale(1)}50%{transform:scale(1.025)}}
  /* question (OX) */
  .qwrap{flex:1;display:flex;align-items:center;justify-content:center;padding:10px 22px}
  .qstmt{font-size:clamp(21px,6.2vw,27px);font-weight:800;line-height:1.42;text-align:center;word-break:keep-all;overflow-wrap:break-word}
  .oxbtns{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 16px calc(18px + env(safe-area-inset-bottom))}
  .oxb{border:none;border-radius:22px;padding:24px 0 20px;font-weight:900;color:#fff;font-size:17px;display:flex;flex-direction:column;align-items:center;gap:5px;cursor:pointer;transition:transform .08s;box-shadow:0 6px 0 rgba(0,0,0,.12)}
  .oxb:active{transform:translateY(3px);box-shadow:0 3px 0 rgba(0,0,0,.12)}
  .oxb .mk{font-size:46px;line-height:1}
  .oxb.o{background:var(--blue)} .oxb.x{background:var(--red)}
  .oxb:disabled{cursor:default}
  .oxb.correct{outline:5px solid #16A34A;outline-offset:-5px}
  .oxb.wrong{opacity:.45}
  /* screens */
  .screen{position:absolute;inset:0;background:var(--card);z-index:30;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:32px}
  .screen.show{display:flex;animation:fade .35s}
  @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .screen .emo{font-size:64px;margin-bottom:6px}
  .screen h1{font-size:26px;font-weight:900;margin:0 0 8px;letter-spacing:-.5px}
  .screen p{font-size:15px;color:var(--mut);margin:0 0 6px;line-height:1.55}
  .screen .tot{font-size:15px;color:var(--mut);margin:6px 0 22px}
  .screen .tot b{color:var(--gold);font-size:26px;font-weight:900}
  .cta{background:var(--ink);color:#fff;border:none;border-radius:16px;padding:17px 40px;font-size:17px;font-weight:800;cursor:pointer;width:100%;max-width:280px}
  .cta:active{opacity:.85}
  .ghost{background:none;border:none;color:var(--mut);font-size:14px;font-weight:600;margin-top:16px;cursor:pointer;text-decoration:underline}
  /* reward popup */
  .rlabel{font-size:14px;color:var(--mut);font-weight:700;margin-bottom:4px}
  .rplus{font-size:56px;font-weight:900;color:var(--gold);letter-spacing:-1.5px;line-height:1}
  .rtot{font-size:15px;color:var(--mut);margin:10px 0 28px}.rtot b{color:var(--ink);font-size:18px}
  .cta.big{background:linear-gradient(90deg,#F59E0B,#D97706);box-shadow:0 7px 0 #B45309;font-size:18px;padding:21px 18px;line-height:1.3;animation:pulse 1.35s ease-in-out infinite}
  .cta.big:active{transform:translateY(4px);box-shadow:0 3px 0 #B45309;animation:none}
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.035)}}
  .quit{background:none;border:none;color:#CBD0D6;font-size:12px;font-weight:500;margin-top:26px;cursor:pointer;text-decoration:underline}
  .quit:active{color:#AEB4BB}
  /* share gate (틀렸을 때) */
  #share{background:radial-gradient(120% 80% at 50% 0%, #FFF7ED 0%, var(--card) 55%)}
  .shead{font-size:22px;font-weight:900;letter-spacing:-.5px;margin-bottom:16px}
  .skeep{font-size:14px;color:var(--mut);font-weight:700}
  .sptsbig{font-size:60px;font-weight:900;color:var(--gold);letter-spacing:-2.5px;line-height:1;margin-top:2px;text-shadow:0 2px 0 #FDE68A}
  .swarn{font-size:15px;color:var(--red);font-weight:800;margin:18px 0 12px;line-height:1.5}
  .sgain{background:linear-gradient(90deg,#ECFDF5,#F0FDF4);border:1.5px solid #6EE7B7;border-radius:14px;padding:12px 16px;font-size:15px;font-weight:800;color:var(--ink);margin:0 0 24px;line-height:1.55}
  .sgain .plus{color:var(--green);font-size:20px}
  .sgain .goalamt{color:var(--gold);font-size:20px}
  .cta.share{background:linear-gradient(90deg,#2563EB,#4F46E5);box-shadow:0 7px 0 #1E3A8A;font-size:18px;padding:21px 16px;animation:pulse 1.35s ease-in-out infinite}
  .cta.share:active{transform:translateY(4px);box-shadow:0 3px 0 #1E3A8A;animation:none}
  .cta.share:disabled{background:#93A4C9;box-shadow:0 7px 0 #6B7FA8;animation:none;opacity:1}
  .cta.done{background:linear-gradient(90deg,#16A34A,#15803D);box-shadow:0 7px 0 #14532D;font-size:18px;padding:21px 16px;animation:pulse 1.2s ease-in-out infinite}
  .cta.done:active{transform:translateY(4px);box-shadow:0 3px 0 #14532D;animation:none}
  /* 첫 페이지 후킹 */
  #start{background:radial-gradient(120% 70% at 50% 0%, #FFF7E6 0%, var(--card) 60%)}
  .s-proof{font-size:13px;color:var(--mut);background:var(--bg);border:1px solid var(--line);border-radius:99px;padding:7px 15px;font-weight:700;margin-bottom:24px}
  .s-proof b{color:var(--red)}
  .s-title{font-size:clamp(30px,9.2vw,42px);font-weight:900;letter-spacing:-1px;line-height:1.22;margin:10px 0 12px}
  .s-title .gold{color:var(--gold);text-shadow:0 2px 0 #FDE68A}
  .s-sub2{font-size:15px;font-weight:800;color:var(--mut);margin-bottom:22px}
  .s-eye2{display:inline-block;font-size:13.5px;font-weight:800;color:#4F46E5;background:#EEF2FF;border:1px solid #C7D2FE;border-radius:99px;padding:6px 15px;margin:2px 0 10px}
  .bgmath{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:0}
  .bgmath span{position:absolute;font-family:ui-monospace,Menlo,monospace;font-weight:900;font-size:clamp(40px,14vw,64px);opacity:.09;white-space:nowrap}
  #start>:not(.bgmath){position:relative;z-index:1}
  /* 정답 칭찬 멘트 */
  .praise{position:absolute;left:0;right:0;top:30%;text-align:center;z-index:25;font-size:30px;font-weight:900;color:var(--blue);opacity:0;pointer-events:none;text-shadow:0 2px 8px #fff}
  .praise.show{animation:praisepop 1s ease}
  @keyframes praisepop{0%{opacity:0;transform:translateY(16px) scale(.75)}18%{opacity:1;transform:translateY(0) scale(1.08)}70%{opacity:1;transform:scale(1)}100%{opacity:0;transform:translateY(-12px) scale(1)}}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="goal"><span class="lbl">🧠 상식 OX · 10,000원</span><span class="pts"><b id="pts">0</b><span class="g"> / 10,000원</span></span></div>
    <div class="dots" id="dots"></div>
  </div>
  <div class="timer">
    <div class="trow"><span class="stg" id="stg">1단계</span><span class="sec" id="sec">⏱ 20</span></div>
    <div class="tbar"><div class="tfill" id="tfill"></div></div>
  </div>
  <div class="qtease" id="qTease"></div>
  <div class="qwrap"><div class="qstmt" id="qStmt">문제</div></div>
  <div class="oxbtns">
    <button class="oxb o" id="btnO" onclick="answer('O')"><span class="mk">〇</span>맞다</button>
    <button class="oxb x" id="btnX" onclick="answer('X')"><span class="mk">✕</span>아니다</button>
  </div>

  <div class="praise" id="praise"></div>

  <div class="screen show" id="start">
    <div class="bgmath" aria-hidden="true">
      <span style="top:10%;left:9%;transform:rotate(-12deg);color:#2563EB">O</span>
      <span style="top:17%;right:8%;transform:rotate(10deg);color:#DC2626">X</span>
      <span style="top:34%;left:4%;transform:rotate(8deg);color:#2563EB">O</span>
      <span style="top:43%;right:4%;transform:rotate(-9deg);color:#DC2626">X</span>
      <span style="top:70%;left:9%;transform:rotate(7deg);color:#DC2626">X</span>
      <span style="top:80%;right:9%;transform:rotate(-8deg);color:#2563EB">O</span>
    </div>
    <div class="emo">🧠</div>
    <div class="s-eye2">OX 퀴즈! 내 상식력은?</div>
    <h1 class="s-title">OX 퀴즈 풀고<br><span class="gold">10,000원</span> 받기</h1>
    <div class="s-sub2">쉬운 O·X만 맞히면 받는다 💰</div>
    <div class="s-proof">🔥 지금 <b>3,127명</b> 도전 중</div>
    <button class="cta big" style="max-width:300px" onclick="start()">시작하기</button>
  </div>

  <div class="screen" id="reward">
    <div class="emo">🎉</div>
    <div class="rlabel" id="rLabel">1단계 클리어 · 적립!</div>
    <div class="rplus" id="rPlus">+100원</div>
    <div class="rtot">지금까지 <b id="rTot">100원</b></div>
    <button class="cta big" id="rNext">한 문제 더 풀고 300원 받기 →</button>
    <button class="quit" id="rQuit">그만두기</button>
  </div>

  <div class="screen" id="share">
    <div class="emo">😮</div>
    <div class="shead">아깝다! 한 끗 차이</div>
    <div class="skeep">지금까지 모은 금액</div>
    <div class="sptsbig" id="sPts">0원</div>
    <div class="swarn">지금 나가면 <b id="sLose">4,000원</b> 다 사라져요 😱</div>
    <div class="sgain" id="sGain"></div>
    <button class="cta share" id="sBtn">📤 공유하고 계속하기</button>
    <button class="cta done" id="sDone" style="display:none">✅ 공유 완료 · 이어하기 →</button>
    <button class="quit" id="sQuit">그만둘래요</button>
  </div>

  <div class="screen" id="final">
    <div class="emo" id="fEmo">🏁</div>
    <h1 id="fTitle">완료!</h1>
    <p id="fSub">10문제 중 <b id="fCorrect">0</b>개 정답</p>
    <div class="tot">획득 금액<br><b id="fPts">0원</b></div>
    <button class="cta" onclick="location.reload()">다시하기</button>
  </div>
</div>

<script>
const S=[
 {q:"밥 먹고 바로 누우면 소화에 안 좋다.",a:"O"},
 {q:"물은 하루에 조금씩 자주 마시는 게 좋다.",a:"O"},
 {q:"담배는 폐 건강에 좋다.",a:"X"},
 {q:"아침을 굶으면 점심에 과식하기 쉽다.",a:"O"},
 {q:"짜게 먹으면 혈압이 올라갈 수 있다.",a:"O"},
 {q:"잠을 3~4시간만 자도 몸에 아무 문제 없다.",a:"X"},
 {q:"앉아만 있는 시간이 길면 허리에 부담이 간다.",a:"O"},
 {q:"야식을 자주 먹으면 체중이 늘기 쉽다.",a:"O"},
 {q:"스트레스는 몸 건강과는 전혀 상관없다.",a:"X"},
 {q:"하루 30분 걷기는 건강에 도움이 된다.",a:"O"},
];
const PTS=[100,200,300,400,500,600,900,1000,2000,4000]; // 합 = 10,000
const GOALP=10000;
const TLIMIT=20;
let si=0,total=0,correct=0,locked=false,tId=null,left=TLIMIT;
const $=id=>document.getElementById(id);

function drawDots(){$('dots').innerHTML=S.map((_,i)=>`<div class="d ${i<si?'done':i===si?'on':''}"></div>`).join('');}
function setPts(v){total=v;$('pts').textContent=v.toLocaleString();}
function start(){$('start').classList.remove('show');render();}

function render(){
  drawDots();
  const q=S[si];
  $('stg').textContent=(si+1)+'단계';
  $('qTease').innerHTML=`이번 맞추면 <span class="plus">+${PTS[si].toLocaleString()}원</span> → 총 <span class="tot">${(total+PTS[si]).toLocaleString()}원</span> 💰`;
  $('qStmt').textContent=q.q;
  $('btnO').className='oxb o'; $('btnX').className='oxb x';
  $('btnO').disabled=false; $('btnX').disabled=false;
  locked=false;
  startTimer();
}
function startTimer(){
  clearInterval(tId); left=TLIMIT;
  $('sec').textContent='⏱ '+TLIMIT; $('sec').classList.remove('warn');
  $('tfill').style.width='100%'; $('tfill').style.background='var(--green)';
  tId=setInterval(()=>{
    left-=0.1;
    if(left<=0){left=0;clearInterval(tId);timeout();}
    $('tfill').style.width=(left/TLIMIT*100)+'%';
    const sec=Math.ceil(left);
    $('sec').textContent='⏱ '+sec;
    if(left<=6){$('sec').classList.add('warn');$('tfill').style.background='var(--red)';}
    else if(left<=12){$('tfill').style.background='#F59E0B';}
  },100);
}
function answer(ans){ if(locked)return; resolve(ans); }
function timeout(){ if(locked)return; resolve(null); }
function resolve(ans){
  locked=true; clearInterval(tId);
  const q=S[si], ok=ans===q.a;
  $('btnO').disabled=true; $('btnX').disabled=true;
  const okBtn=q.a==='O'?'btnO':'btnX', other=q.a==='O'?'btnX':'btnO';
  $(okBtn).classList.add('correct'); $(other).classList.add('wrong');
  if(ok){ correct++; setPts(total+PTS[si]); showPraise(); setTimeout(showReward,1100); }
  else { setTimeout(showShare,1000); }   // 틀리면 공유 게이트 (적립 X)
}
const PRAISE=["와 잘하는데! 🎉","천재인데?! 🧠","상식 팽팽! ⚡","완벽해요! 👏","상식왕 등극 👑","눈썰미 최고! 👀","척척박사 인정 🎓","오 정확해요! ✅"];
function showPraise(){
  const el=$('praise'); el.textContent=PRAISE[Math.floor(Math.random()*PRAISE.length)];
  el.classList.remove('show'); void el.offsetWidth; el.classList.add('show');
}
function showReward(){
  const last=si===S.length-1;
  $('rLabel').textContent=(si+1)+'단계 클리어 · 적립!';
  $('rPlus').textContent='+'+PTS[si].toLocaleString()+'원';
  $('rTot').textContent=total.toLocaleString()+'원';
  if(last){
    $('rNext').textContent='🏆 완료! '+total.toLocaleString()+'원 받기';
    $('rNext').onclick=quit; $('rQuit').style.display='none';
  }else{
    $('rNext').textContent='한 문제 더 풀고 '+(total+PTS[si+1]).toLocaleString()+'원 받기 →';
    $('rNext').onclick=goNext; $('rQuit').style.display='';
  }
  $('reward').classList.add('show');
}
function goNext(){ $('reward').classList.remove('show'); si++; if(si<S.length) render(); else finish(); }
function quit(){ $('reward').classList.remove('show'); $('share').classList.remove('show'); finish(); }
$('rQuit').onclick=quit;
// 공유 게이트 (틀렸을 때) — 공유하기 → OS 공유 모달 → 닫으면 '공유 완료' 버튼 노출 → 눌러야 진행
function showShare(){
  $('sPts').textContent=total.toLocaleString()+'원';
  $('sLose').textContent=total.toLocaleString()+'원';
  const remain=GOALP-total, last=si===S.length-1;
  $('sGain').innerHTML = last
    ? `공유하고 <b class="goalamt">${total.toLocaleString()}원</b> 지키기 💰`
    : `이어서 풀면 <b class="plus">+${remain.toLocaleString()}원</b> 더!<br>끝까지 가면 <b class="goalamt">10,000원</b> 💰`;
  $('sBtn').style.display=''; $('sBtn').disabled=false; $('sBtn').textContent='📤 공유하고 계속하기';
  $('sDone').style.display='none';
  $('share').classList.add('show');
}
function doShare(){
  const url=location.href.split('?')[0];
  const d={title:'OX 퀴즈 풀고 10,000원 받기',text:`나 ${total.toLocaleString()}원 모았어! 너도 도전 🔥`,url};
  const reveal=()=>{ $('sBtn').style.display='none'; $('sDone').style.display=''; };
  try{
    if(navigator.share){ $('sBtn').disabled=true; $('sBtn').textContent='공유 창 열림…'; navigator.share(d).then(reveal).catch(reveal); }
    else{ if(navigator.clipboard) navigator.clipboard.writeText(d.text+' '+url).catch(()=>{}); reveal(); }
  }catch(e){ reveal(); }
}
function shareDone(){ $('share').classList.remove('show'); si++; if(si<S.length) render(); else finish(); }
$('sBtn').onclick=doShare; $('sDone').onclick=shareDone; $('sQuit').onclick=quit;
function finish(){
  drawDots();
  $('fCorrect').textContent=correct;
  $('fPts').textContent=total.toLocaleString()+'원';
  $('fEmo').textContent = correct===10?'🏆': correct>=7?'🎉':'🏁';
  $('fTitle').textContent = correct===10?'전부 정답! 10,000원!': '완료!';
  $('final').classList.add('show');
}
drawDots();
</script>
</body>
</html>
